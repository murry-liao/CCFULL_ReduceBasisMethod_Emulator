[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccfull-rom"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4", "ipykernel>=6", "nbformat>=5.10",
    "pandas>=2.0", "plotly>=5.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["emulator*", "physical_model*"]
exclude = ["data*"]
namespaces = false
